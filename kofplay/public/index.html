<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="KofPlay — aprenda a linguagem Kof resolvendo desafios no navegador.">
    <title>KofPlay — Aprenda Kof jogando</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="bg-grid" aria-hidden="true"></div>

    <div class="shell">
        <aside class="sidebar">
            <div class="brand">
                <span class="brand-logo" aria-hidden="true">🎮</span>
                <div>
                    <h1>KofPlay</h1>
                    <p>aprenda Kof resolvendo desafios</p>
                </div>
            </div>

            <div class="xp-card">
                <div class="xp-row">
                    <span>Seu XP</span>
                    <span id="xpLabel" class="mono">0 XP</span>
                </div>
                <div class="xp-track"><div id="xpBar" class="xp-fill"></div></div>
                <div id="doneLabel" class="xp-sub">0 de 0 lições</div>
            </div>

            <nav id="lessonList" class="lessons" aria-label="Lições"></nav>

            <div class="side-foot">
                <span id="healthBadge" class="badge badge-muted">health: …</span>
                <span class="kof-ver">kof <span id="kofVer">…</span></span>
            </div>
        </aside>

        <main class="main">
            <section id="lessonBox" class="card">
                <p class="muted">Carregando lições…</p>
            </section>

            <section class="card">
                <div class="card-head">
                    <h2>Editor <span class="sub">Tab indenta · Ctrl+Enter executa</span></h2>
                    <div class="btn-row">
                        <button id="runBtn" class="btn btn-secondary">▶ Executar</button>
                        <button id="submitBtn" class="btn btn-primary">✅ Submeter</button>
                    </div>
                </div>
                <div class="editor-wrap">
                    <div id="gutter" class="gutter" aria-hidden="true">1</div>
                    <textarea id="codeArea" class="editor" rows="13" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Seu código Kof aqui…"></textarea>
                </div>
                <div class="link-row">
                    <button id="hintBtn" class="link">💡 Dica</button>
                    <button id="solutionBtn" class="link link-dim">👁 Ver solução</button>
                    <input id="apiKeyInput" type="password" placeholder="x-api-key (opcional)" autocomplete="off" spellcheck="false">
                </div>
                <div id="hintBox" class="note note-warn hidden"></div>
                <div id="solutionBox" class="note note-code hidden"></div>
            </section>

            <section class="card">
                <div class="card-head">
                    <h2>Saída</h2>
                    <span id="statusBadge" class="badge badge-muted">idle</span>
                </div>
                <pre id="outputBox" class="console">Escolha uma lição e clique em Executar ou Submeter.</pre>
                <div id="verdictBox" class="verdict hidden"></div>
            </section>
        </main>
    </div>

    <footer class="footer">
        <span>Powered by <strong>Kof Lang</strong> · execução no compilador de verdade</span>
        <span><a href="/api/health">/api/health</a> · <a href="/api/lessons">/api/lessons</a></span>
    </footer>

    <script src="/app.js"></script>
</body>
</html>
